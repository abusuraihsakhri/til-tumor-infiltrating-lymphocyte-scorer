name: Test and package
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Python regression tests
        run: python -m pytest -q
      - name: Verify package build
        run: python -m build --wheel
      - name: Browser JavaScript regression tests
        run: node --test tests/browser.test.cjs
      - name: Validate browser JavaScript syntax
        run: |
          node --check web/scorer.js
          node --check web/app.js
